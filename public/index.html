<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6b45">
  <meta name="description" content="Health guidance in English, Pidgin, Yoruba and Hausa. Find out if you can rest at home, should see a clinic, or need help now.">
  <title>Ask Dokita</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b6b45'/%3E%3Cpath d='M14 9h4v5h5v4h-5v5h-4v-5H9v-4h5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" />
          <path d="M14 9h4v5h5v4h-5v5h-4v-5H9v-4h5z" />
        </svg>
        <div>
          <h1>Ask Dokita</h1>
          <p id="tagline" class="tagline"></p>
        </div>
      </div>
      <div class="controls">
        <button id="restart" class="icon-btn" type="button" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4" /></svg>
          <span id="restartLabel"></span>
        </button>
        <label class="lang">
          <span class="sr" id="langLabel">Language</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z" /></svg>
          <select id="lang" aria-labelledby="langLabel">
            <option value="en">English</option>
            <option value="pcm">Pidgin</option>
            <option value="yo">Yorùbá</option>
            <option value="ha">Hausa</option>
          </select>
        </label>
      </div>
    </header>

    <p class="notice" id="notice"></p>

    <main id="chat" aria-live="polite">
      <section class="welcome" id="welcome">
        <h2 id="welcomeTitle"></h2>
        <p id="welcomeBody"></p>
        <ol class="steps" id="steps"></ol>
        <p class="chips-label" id="chipsLabel"></p>
        <div class="chips" id="chips"></div>
      </section>
    </main>

    <form id="form" class="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="1000" aria-label="Describe your symptoms"></textarea>
      <button id="send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5z" /></svg>
      </button>
    </form>
    <p class="foot" id="foot"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
